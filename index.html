<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1417">
<title>غرفتي الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#0e1417; --surface:#151e22; --raised:#1c2830; --line:#26343c;
  --text:#eaf2f0; --muted:#8aa0a6;
  --amber:#ffc66b; --air:#6fd3e6; --ok:#5fd6a0; --alert:#ff6b5e;
  --glow:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;line-height:1.5;
}
.app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
button,input{font-family:inherit}
button{cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--air);outline-offset:2px}

/* الشريط العلوي */
.topbar{display:flex;align-items:center;justify-content:space-between}
.topbar h1{margin:0;font-size:1.3rem;font-weight:700}
.top-actions{display:flex;align-items:center;gap:8px}
.badge{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.badge i{width:8px;height:8px;border-radius:50%;background:#e0a93b}
.badge.online{color:var(--ok)} .badge.online i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.badge.offline{color:var(--alert)} .badge.offline i{background:var(--alert)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1rem}

.drawer{display:none;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.drawer.open{display:block}
.drawer label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:8px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.95rem;outline:none}
input[type=text]:focus,input[type=password]:focus{border-color:var(--air)}

.alert{display:none;background:var(--alert);color:#2a0905;padding:12px 14px;border-radius:16px;font-weight:700;font-size:.92rem;text-align:center}
.alert.show{display:block}

/* بطاقة الغرفة */
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 18px;display:flex;align-items:center;gap:18px}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,198,107,.55),rgba(255,198,107,0) 65%);opacity:calc(var(--glow)*.9);transition:opacity .5s}
.gauge{position:relative;width:132px;height:132px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:9;stroke-linecap:round}
.gauge .track{stroke:var(--raised)}
.gauge .fill{stroke:var(--air);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .6s,stroke .4s}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge b{font-size:2rem;font-weight:700;line-height:1}
.gauge span{font-size:.75rem;color:var(--muted);margin-top:4px}
.stats{position:relative;flex:1;display:flex;flex-direction:column;gap:10px}
.stat{display:flex;align-items:center;gap:10px;background:rgba(14,20,23,.55);border-radius:14px;padding:10px 12px}
.stat em{font-style:normal;font-size:1.2rem}
.stat div{display:flex;flex-direction:column}
.stat b{font-size:1.05rem;font-weight:600}
.stat small{font-size:.72rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.card h2{margin:0 0 12px;font-size:.95rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.timer{color:var(--amber);font-weight:600}

/* المساعد */
.mic-row{display:flex;gap:12px;align-items:center}
.mic{flex:none;width:64px;height:64px;border-radius:50%;border:none;font-size:1.6rem;background:var(--air);color:#06242b;position:relative;transition:transform .15s}
.mic:active{transform:scale(.94)}
.mic.listening{background:var(--alert);color:#fff;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,107,94,.55)}100%{box-shadow:0 0 0 20px rgba(255,107,94,0)}}
.bubble{flex:1;min-height:64px;background:var(--bg);border-radius:18px;padding:12px 14px;font-size:.9rem;display:flex;align-items:center}
.bubble.busy::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--air);margin-inline-start:8px;animation:blink .8s infinite alternate}
@keyframes blink{to{opacity:.2}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--raised);padding:8px 14px;border-radius:99px;font-size:.84rem}
.chip:active{background:var(--line)}
.send-row{display:flex;gap:8px;margin-top:10px}
.send{flex:none;padding:0 18px;border:none;border-radius:14px;background:var(--text);color:var(--bg);font-weight:700}

/* الأوضاع */
.scenes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.scene{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--raised);font-size:.92rem;font-weight:600;text-align:start;transition:background .2s,border-color .2s}
.scene em{font-style:normal;font-size:1.4rem}
.scene.active{border-color:var(--amber);background:rgba(255,198,107,.12)}
.scene.off{grid-column:span 2;justify-content:center;color:#ffb3ab}
.scene:active{transform:scale(.98)}

/* المناخ */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row+.row{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.row p{margin:0;font-weight:600;font-size:.95rem}
.row small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.switch{position:relative;flex:none;width:54px;height:32px;border-radius:99px;border:none;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(-22px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-size:1.3rem}
.stepper b{min-width:62px;text-align:center;font-size:1.2rem;color:var(--air)}
#spRow.disabled{opacity:.4;pointer-events:none}

/* الأجهزة */
.dev{--c:var(--amber);background:var(--raised);border-radius:18px;padding:14px;border:1px solid transparent;transition:border-color .2s}
.dev+.dev{margin-top:10px}
.dev.on{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.dev-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dev-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--bg);filter:grayscale(1) brightness(.7);transition:all .3s}
.dev.on .dev-ico{filter:none;background:color-mix(in srgb,var(--c) 22%,var(--bg));box-shadow:0 0 calc(var(--v)*.2px) color-mix(in srgb,var(--c) 70%,transparent)}
.dev-name{flex:1;font-weight:600;font-size:.95rem}
.dev-name small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.dev.auto-driven .dev-name small::after{content:" • يتحكم بها الوضع التلقائي";color:var(--ok)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to left,var(--c) calc(var(--v)*1%),var(--bg) 0)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--bg)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:none}

.toast{position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:88%;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:.88rem;opacity:0;transform:translateY(16px);pointer-events:none;transition:all .25s;z-index:9}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.hero{flex-direction:column}}
</style>
</head>
<body>
<main class="app">

  <header class="topbar">
    <h1>غرفتي الذكية</h1>
    <div class="top-actions">
      <div class="badge" id="conn"><i></i><span>جاري الاتصال</span></div>
      <button class="icon-btn" id="gear" aria-label="إعدادات المفتاح">⚙️</button>
    </div>
  </header>

  <section class="drawer" id="drawer">
    <label for="apiKey">مفتاح Groq API (يُحفظ في هذا الجهاز فقط)</label>
    <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off">
  </section>

  <div class="alert" id="alert" role="alert">🚨 حرارة الغرفة مرتفعة جداً</div>

  <section class="hero" id="hero">
    <div class="gauge">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" id="ring" cx="60" cy="60" r="52"/></svg>
      <div class="center"><b id="tempDisp">--°</b><span>الحرارة</span></div>
    </div>
    <div class="stats">
      <div class="stat"><em>💧</em><div><b id="humDisp">--%</b><small>الرطوبة</small></div></div>
      <div class="stat"><em>☀️</em><div><b id="lightDisp">--%</b><small>الإضاءة</small></div></div>
    </div>
  </section>

  <section class="card">
    <h2>المساعد الصوتي</h2>
    <div class="mic-row">
      <button class="mic" id="mic" aria-label="تحدث مع الغرفة">🎙️</button>
      <div class="bubble" id="reply">اضغط الميكروفون وقل طلبك، أو اختر اقتراحاً.</div>
    </div>
    <div class="chips" id="chips"></div>
    <form class="send-row" id="textForm">
      <input type="text" id="textCmd" placeholder="اكتب طلبك هنا" enterkeyhint="send">
      <button class="send" type="submit">إرسال</button>
    </form>
  </section>

  <section class="card">
    <h2><span>الأوضاع السريعة</span><span class="timer" id="timer"></span></h2>
    <div class="scenes" id="scenes">
      <button class="scene" data-s="study"><em>📚</em>وضع الدراسة</button>
      <button class="scene" data-s="cinema"><em>🎬</em>وضع السينما</button>
      <button class="scene" data-s="sleep"><em>🌙</em>وضع النوم</button>
      <button class="scene" data-s="work"><em>💻</em>وضع العمل</button>
      <button class="scene off" data-s="off">🛑 إطفاء كل الأجهزة</button>
    </div>
  </section>

  <section class="card">
    <h2>التبريد</h2>
    <div class="row">
      <p>الوضع التلقائي<small>يضبط السقف والمروحة حسب الحرارة</small></p>
      <button class="switch on" id="autoSw" role="switch" aria-checked="true" aria-label="الوضع التلقائي"></button>
    </div>
    <div class="row" id="spRow">
      <p>الحرارة المطلوبة</p>
      <div class="stepper">
        <button id="spPlus" aria-label="زيادة">+</button>
        <b id="spVal">26°C</b>
        <button id="spMinus" aria-label="إنقاص">−</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>الأجهزة</h2>
    <div id="devices"></div>
  </section>

</main>
<div class="toast" id="toast"></div>

<script>
const TOPIC_CMD="ameer/smartroom/2026/cmd", TOPIC_STATUS="ameer/smartroom/2026/status";
const DEV=[
  {id:'main', name:'إضاءة السقف', ico:'💡', c:'#ffc66b', auto:true},
  {id:'desk', name:'إضاءة المكتب', ico:'🖥️', c:'#ffd9a0'},
  {id:'night',name:'الإضاءة الليلية', ico:'✨', c:'#b9a6ff'},
  {id:'fan',  name:'مروحة التبريد', ico:'🌀', c:'#6fd3e6', auto:true}
];
const SCENES={
  study :{main:0,desk:100,night:0,fan:null,auto:true,sp:23,msg:'📚 تم تفعيل وضع الدراسة'},
  cinema:{main:0,desk:0,night:35,fan:40,auto:false,msg:'🎬 تم تفعيل وضع السينما'},
  sleep :{main:0,desk:0,night:15,fan:30,auto:false,msg:'🌙 تصبح على خير، تم تفعيل وضع النوم'},
  work  :{main:80,desk:70,night:0,fan:null,auto:true,sp:25,msg:'💻 تم تفعيل وضع العمل'},
  off   :{main:0,desk:0,night:0,fan:0,auto:false,msg:'🛑 تم إطفاء جميع الأجهزة'}
};
const SUGGEST=['شغّل ضوء المكتب','فعّل وضع النوم','الجو حار','اطفئ المروحة','أطفئ كل شيء','ذكّرني بعد 10 دقائق'];

const $=id=>document.getElementById(id);
let isAuto=true, targetTemp=26, liveTemp=25, liveHum=50, liveLight=50;
let alarmSpoken=false, activeScene=null;
const state={main:0,desk:0,night:0,fan:0};

/* ===== واجهة ===== */
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function buzz(){if(navigator.vibrate)navigator.vibrate(12)}
function say(msg,busy){const r=$('reply');r.textContent=msg;r.classList.toggle('busy',!!busy)}

// بناء بطاقات الأجهزة
$('devices').innerHTML=DEV.map(d=>`
  <div class="dev" id="dev-${d.id}" style="--c:${d.c};--v:0">
    <div class="dev-top">
      <div class="dev-ico">${d.ico}</div>
      <div class="dev-name">${d.name}<small id="lbl-${d.id}">مطفأ</small></div>
      <button class="switch" id="sw-${d.id}" role="switch" aria-checked="false" aria-label="${d.name}"></button>
    </div>
    <input type="range" id="sl-${d.id}" min="0" max="100" value="0" aria-label="شدة ${d.name}">
  </div>`).join('');
$('chips').innerHTML=SUGGEST.map(s=>`<button class="chip" type="button">${s}</button>`).join('');

function setControl(name,val){
  state[name]=val;
  const el=$('dev-'+name);
  $('sl-'+name).value=val;
  el.style.setProperty('--v',val);
  el.classList.toggle('on',val>0);
  const sw=$('sw-'+name); sw.classList.toggle('on',val>0); sw.setAttribute('aria-checked',val>0);
  $('lbl-'+name).textContent=val>0?val+'%':'مطفأ';
  updateGlow(); updateAutoDriven();
}
function updateGlow(){
  const g=Math.max(state.main,state.desk*.8,state.night*.5)/100;
  document.documentElement.style.setProperty('--glow',g.toFixed(2));
}
function updateAutoDriven(){
  DEV.forEach(d=>{ if(d.auto) $('dev-'+d.id).classList.toggle('auto-driven',isAuto) });
}
function updateAutoUI(on){
  isAuto=on;
  $('autoSw').classList.toggle('on',on); $('autoSw').setAttribute('aria-checked',on);
  $('spRow').classList.toggle('disabled',!on);
  updateAutoDriven();
}
function updateSP(v){
  targetTemp=Math.min(35,Math.max(18,v));
  $('spVal').textContent=targetTemp+'°C';
  updateRing();
}
function updateRing(){
  const frac=Math.min(1,Math.max(0,(liveTemp-15)/30));
  const ring=$('ring');
  ring.style.strokeDashoffset=326.7*(1-frac);
  ring.style.stroke=liveTemp>=38?'var(--alert)':liveTemp>targetTemp+1?'var(--amber)':'var(--air)';
}
function markScene(s){
  activeScene=s;
  document.querySelectorAll('.scene').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
}

/* ===== MQTT ===== */
let sendT;
function sendCmd(extra={}){
  if(!client.connected) return toast('غير متصل بالغرفة');
  client.publish(TOPIC_CMD,JSON.stringify({...state,auto:isAuto,sp:targetTemp,...extra}));
}
function sendSoon(){clearTimeout(sendT);sendT=setTimeout(()=>sendCmd(),100)}

const badge=$('conn');
function setBadge(cls,txt){badge.className='badge '+cls;badge.querySelector('span').textContent=txt}
const client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{reconnectPeriod:3000});
client.on('connect',()=>{setBadge('online','متصل');client.subscribe(TOPIC_STATUS)});
client.on('reconnect',()=>setBadge('','إعادة الاتصال'));
client.on('offline',()=>setBadge('offline','غير متصل'));
client.on('error',()=>setBadge('offline','خطأ اتصال'));

client.on('message',(topic,message)=>{
  if(topic!==TOPIC_STATUS) return;
  let d; try{d=JSON.parse(message.toString())}catch{return}
  liveTemp=d.temp; liveHum=d.hum; liveLight=d.light;
  $('tempDisp').textContent=liveTemp.toFixed(1)+'°';
  $('humDisp').textContent=liveHum+'%';
  $('lightDisp').textContent=liveLight+'%';
  $('timer').textContent=d.rem>0?`⏱️ ${d.rem} ث`:'';
  updateRing();
  const hot=liveTemp>=38;
  $('alert').classList.toggle('show',hot);
  if(hot){ if(!alarmSpoken){speak('تحذير، حرارة الغرفة مرتفعة');alarmSpoken=true} } else alarmSpoken=false;
  if(d.auto!==isAuto) updateAutoUI(d.auto);
  if(isAuto){ setControl('main',d.main); setControl('fan',d.fan); }
});

/* ===== تفاعل المستخدم ===== */
$('gear').onclick=()=>$('drawer').classList.toggle('open');
const keyInput=$('apiKey');
keyInput.value=localStorage.getItem('groq_key')||'';
if(!keyInput.value) $('drawer').classList.add('open');
keyInput.addEventListener('input',()=>localStorage.setItem('groq_key',keyInput.value.trim()));

DEV.forEach(d=>{
  $('sl-'+d.id).addEventListener('input',e=>{
    if(d.auto&&isAuto) updateAutoUI(false);
    markScene(null);
    setControl(d.id,+e.target.value); sendSoon();
  });
  $('sw-'+d.id).addEventListener('click',()=>{
    if(d.auto&&isAuto) updateAutoUI(false);
    markScene(null); buzz();
    setControl(d.id,state[d.id]>0?0:100); sendCmd();
  });
});

$('autoSw').onclick=()=>{
  updateAutoUI(!isAuto); buzz(); markScene(null); sendCmd();
  toast(isAuto?'الوضع التلقائي يعمل':'التحكم اليدوي');
};
$('spPlus').onclick =()=>{updateSP(targetTemp+1);buzz();sendSoon()};
$('spMinus').onclick=()=>{updateSP(targetTemp-1);buzz();sendSoon()};

function applyScene(name){
  const s=SCENES[name]; if(!s) return;
  buzz();
  ['main','desk','night','fan'].forEach(k=>{ if(s[k]!==null&&s[k]!==undefined) setControl(k,s[k]) });
  if(s.sp) updateSP(s.sp);
  updateAutoUI(s.auto);
  markScene(name);
  sendCmd();
  say(s.msg); toast(s.msg);
}
$('scenes').addEventListener('click',e=>{const b=e.target.closest('.scene'); if(b) applyScene(b.dataset.s)});

/* ===== المساعد ===== */
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  say('أنت: '+c.textContent); askAI(c.textContent);
});
$('textForm').addEventListener('submit',e=>{
  e.preventDefault();
  const i=$('textCmd'), t=i.value.trim(); if(!t) return;
  i.value=''; say('أنت: '+t); askAI(t);
});
$('mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return toast('استخدم متصفح Chrome للصوت');
  const rec=new SR(), mic=$('mic');
  rec.lang='ar-IQ';
  mic.classList.add('listening'); say('👂 أستمع إليك...');
  rec.onresult=e=>{const t=e.results[0][0].transcript; say('أنت: '+t); askAI(t)};
  rec.onerror=()=>{say('لم أسمعك جيداً، حاول مرة أخرى')};
  rec.onend=()=>mic.classList.remove('listening');
  rec.start();
};

async function askAI(userText){
  const apiKey=keyInput.value.trim();
  if(!apiKey){
    $('drawer').classList.add('open'); window.scrollTo({top:0});
    return say('⚠️ أدخل مفتاح Groq API في الأعلى أولاً');
  }
  say('جاري التنفيذ',true);
  const prompt=`أنت مساعد غرفة ذكية. الحالة: حرارة ${liveTemp}°C، رطوبة ${liveHum}%، إضاءة ${liveLight}%، السقف(main): ${state.main}%، المكتب(desk): ${state.desk}%، الليلية(night): ${state.night}%، المروحة(fan): ${state.fan}%، التلقائي: ${isAuto}.
أرجع JSON فقط: {"main":0-100 أو -1,"desk":0-100 أو -1,"night":0-100 أو -1,"fan":0-100 أو -1,"auto":true/false/null,"timer":ثواني أو -1,"reply":"رد عربي قصير"}`;
  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
      body:JSON.stringify({
        model:'openai/gpt-oss-20b',
        messages:[{role:'system',content:prompt},{role:'user',content:userText}],
        response_format:{type:'json_object'},temperature:0.2
      })
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error?.message||res.status);
    const cmd=JSON.parse(data.choices[0].message.content);
    if(cmd.auto!==null&&cmd.auto!==undefined&&cmd.auto!==isAuto) updateAutoUI(cmd.auto);
    if(cmd.desk>=0) setControl('desk',cmd.desk);
    if(cmd.night>=0) setControl('night',cmd.night);
    if(!isAuto){
      if(cmd.main>=0) setControl('main',cmd.main);
      if(cmd.fan>=0) setControl('fan',cmd.fan);
    }
    markScene(null);
    sendCmd(cmd.timer>0?{timer:cmd.timer}:{});
    say('🤖 '+cmd.reply); speak(cmd.reply);
  }catch(e){
    say('❌ تعذر التنفيذ: '+e.message);
  }
}
function speak(text){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(text); u.lang='ar-SA';
    speechSynthesis.speak(u);
  }
}

// حالة البداية
DEV.forEach(d=>setControl(d.id,0));
updateAutoUI(true); updateSP(targetTemp);
</script>
