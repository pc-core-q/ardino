<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غرفتي الذكية</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card-light: #1b2640;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --purple: #8b5cf6;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      display: flex; justify-content: center;
    }
    .app { width: 100%; max-width: 440px; }

    /* الشريط العلوي */
    .topbar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .topbar h1 { margin: 0; font-size: 1.25rem; font-weight: 800; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      font-size: 0.78rem; padding: 5px 12px; border-radius: 99px; font-weight: 600;
      background: rgba(245, 158, 11, 0.15); color: #fbbf24;
    }
    .status-dot.online { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .icon-btn {
      background: var(--card); border: 1px solid rgba(255,255,255,0.08); color: var(--text);
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1rem;
    }

    /* صندوق API Key القابل للطي */
    .settings-drawer {
      display: none; background: var(--card); padding: 12px; border-radius: 16px;
      margin-bottom: 14px; border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .settings-drawer label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }

    /* تنبيه الطوارئ */
    .alert {
      display: none; background: var(--red); color: white; padding: 12px; border-radius: 14px;
      text-align: center; font-weight: 700; margin-bottom: 14px; font-size: 0.9rem;
    }

    /* القراءات الأساسية */
    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;
    }
    .metric-card {
      background: var(--card); padding: 12px 8px; border-radius: 16px; text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .metric-val { font-size: 1.3rem; font-weight: 800; color: var(--accent); margin-bottom: 2px; }
    .metric-lbl { font-size: 0.75rem; color: var(--muted); }

    /* بطاقة المساعد الصوتي */
    .card {
      background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .mic-btn {
      width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 0.95rem;
      font-weight: 700; color: white; cursor: pointer;
      background: linear-gradient(135deg, #2563eb, var(--purple));
      transition: transform 0.15s;
    }
    .mic-btn:active { transform: scale(0.98); }
    .mic-btn.listening { background: var(--red); animation: pulse 1s infinite; }

    .input-group { display: flex; gap: 8px; margin-top: 10px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: var(--bg); color: white; font-size: 0.9rem; outline: none;
    }
    .send-btn {
      padding: 0 16px; border: none; border-radius: 12px; background: var(--accent);
      color: #0b1120; font-weight: 700; cursor: pointer;
    }
    .ai-reply {
      margin-top: 10px; font-size: 0.88rem; color: #e2e8f0; background: var(--bg);
      padding: 10px 12px; border-radius: 12px; line-height: 1.5;
    }

    /* الأوضاع السريعة */
    .section-title {
      font-size: 0.85rem; color: var(--muted); font-weight: 700; margin: 0 0 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .scenes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .scene-btn {
      padding: 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.07);
      background: var(--card-light); color: var(--text); font-size: 0.88rem;
      font-weight: 600; cursor: pointer; text-align: center;
    }
    .scene-btn.active { background: var(--green); color: #052e16; border-color: var(--green); }
    .scene-btn.off-all { grid-column: span 2; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

    .sp-box {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.07);
    }

    /* بطاقات الأجهزة */
    .device-row {
      background: var(--card-light); padding: 12px; border-radius: 14px; margin-bottom: 10px;
    }
    .device-row:last-child { margin-bottom: 0; }
    .device-top {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .device-name { font-size: 0.92rem; font-weight: 600; }
    .toggle-pill {
      padding: 4px 12px; border-radius: 99px; border: none; font-size: 0.8rem;
      font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.1); color: var(--muted);
    }
    .toggle-pill.on { background: var(--accent); color: #0b1120; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; margin: 0; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>
<div class="app">

  <!-- الشريط العلوي -->
  <div class="topbar">
    <h1>غرفتي الذكية</h1>
    <div class="top-actions">
      <div class="status-dot" id="connBadge">جاري الاتصال...</div>
      <button class="icon-btn" onclick="toggleSettings()" title="إعدادات المفتاح">⚙️</button>
    </div>
  </div>

  <!-- إعداد مفتاح الذكاء الاصطناعي -->
  <div class="settings-drawer" id="settingsBox">
    <label>مفتاح Groq API (يُحفظ تلقائياً في هاتفك):</label>
    <input type="password" id="apiKey" placeholder="الصق المفتاح هنا (gsk_...)">
  </div>

  <!-- تنبيه الحرارة العالية -->
  <div class="alert" id="safetyBanner">🚨 تنبيه: حرارة الغرفة مرتفعة جداً!</div>

  <!-- القراءات الحية -->
  <div class="metrics">
    <div class="metric-card">
      <div class="metric-val" id="tempDisp">--°</div>
      <div class="metric-lbl">🌡️ الحرارة</div>
    </div>
    <div class="metric-card">
      <div class="metric-val" id="humDisp">--%</div>
      <div class="metric-lbl">💧 الرطوبة</div>
    </div>
    <div class="metric-card">
      <div class="metric-val" id="lightDisp">--%</div>
      <div class="metric-lbl">☀️ الإضاءة</div>
    </div>
  </div>

  <!-- المساعد الصوتي -->
  <div class="card">
    <button class="mic-btn" id="micBtn" onclick="startVoice()">🎙️ اضغط للتحدث مع الغرفة</button>
    <div class="input-group">
      <input type="text" id="textCmd" placeholder="أو اكتب طلبك هنا..." onkeydown="if(event.key==='Enter') sendTextCmd()">
      <button class="send-btn" onclick="sendTextCmd()">إرسال</button>
    </div>
    <div class="ai-reply" id="aiLog">أهلاً! قل مثلاً: "شغّل ضوء المكتب" أو "فعّل وضع النوم".</div>
  </div>

  <!-- الأوضاع الذكية -->
  <div class="card">
    <div class="section-title">
      <span>⚡ الأوضاع السريعة</span>
      <span id="timerText" style="color:#c084fc;"></span>
    </div>
    <div class="scenes">
      <button class="scene-btn active" id="autoBtn" onclick="toggleAuto()">🤖 تلقائي ذكي</button>
      <button class="scene-btn" onclick="setScene('study')">📚 وضع الدراسة</button>
      <button class="scene-btn" onclick="setScene('cinema')">🎬 وضع السينما</button>
      <button class="scene-btn" onclick="setScene('sleep')">🌙 وضع النوم</button>
      <button class="scene-btn off-all" onclick="setScene('off')">🛑 إطفاء كل الأجهزة</button>
    </div>

    <div class="sp-box" id="spBox">
      <div class="section-title" style="margin-bottom:4px;">
        <span>🎯 درجة التبريد المطلوبة</span>
        <b id="spVal" style="color:var(--accent);">26°C</b>
      </div>
      <input type="range" min="18" max="35" value="26" oninput="updateSetpoint(this.value)">
    </div>
  </div>

  <!-- التحكم المباشر بالأجهزة -->
  <div class="card">
    <div class="section-title"><span>🎛️ التحكم بالأجهزة</span></div>

    <div class="device-row">
      <div class="device-top">
        <span class="device-name">💡 إضاءة السقف</span>
        <button class="toggle-pill" id="mainPill" onclick="quickToggle('main')">0%</button>
      </div>
      <input type="range" id="mainSlider" min="0" max="100" value="0" oninput="onSlider('main', true)">
    </div>

    <div class="device-row">
      <div class="device-top">
        <span class="device-name">🛋️ إضاءة المكتب</span>
        <button class="toggle-pill" id="deskPill" onclick="quickToggle('desk')">0%</button>
      </div>
      <input type="range" id="deskSlider" min="0" max="100" value="0" oninput="onSlider('desk', false)">
    </div>

    <div class="device-row">
      <div class="device-top">
        <span class="device-name">✨ الإضاءة الليلية</span>
        <button class="toggle-pill" id="nightPill" onclick="quickToggle('night')">0%</button>
      </div>
      <input type="range" id="nightSlider" min="0" max="100" value="0" oninput="onSlider('night', false)">
    </div>

    <div class="device-row">
      <div class="device-top">
        <span class="device-name">🌀 مروحة التبريد</span>
        <button class="toggle-pill" id="fanPill" onclick="quickToggle('fan')">0%</button>
      </div>
      <input type="range" id="fanSlider" min="0" max="100" value="0" oninput="onSlider('fan', true)">
    </div>
  </div>

</div>

<script>
  let isAuto = true, targetTemp = 26, liveTemp = 25, liveHum = 50, liveLight = 50;
  let alarmSpoken = false;

  const TOPIC_CMD    = "ameer/smartroom/2026/cmd";
  const TOPIC_STATUS = "ameer/smartroom/2026/status";

  // حفظ واسترجاع المفتاح
  const keyInput = document.getElementById('apiKey');
  keyInput.value = localStorage.getItem('groq_key') || '';
  if (!keyInput.value) document.getElementById('settingsBox').style.display = 'block';
  keyInput.addEventListener('input', () => localStorage.setItem('groq_key', keyInput.value.trim()));

  function toggleSettings() {
    const box = document.getElementById('settingsBox');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  }

  // الاتصال السحابي MQTT
  const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
  client.on('connect', () => {
    const badge = document.getElementById('connBadge');
    badge.innerText = "متصل 🟢";
    badge.classList.add('online');
    client.subscribe(TOPIC_STATUS);
  });

  client.on('message', (topic, message) => {
    if (topic !== TOPIC_STATUS) return;
    const d = JSON.parse(message.toString());
    liveTemp = d.temp; liveHum = d.hum; liveLight = d.light;

    document.getElementById('tempDisp').innerText  = liveTemp.toFixed(1) + '°';
    document.getElementById('humDisp').innerText   = liveHum + '%';
    document.getElementById('lightDisp').innerText = liveLight + '%';

    document.getElementById('timerText').innerText = d.rem > 0 ? `⏱️ ${d.rem}ث` : '';

    const banner = document.getElementById('safetyBanner');
    if (liveTemp >= 38.0) {
      banner.style.display = 'block';
      if (!alarmSpoken) { speak("تحذير، حرارة الغرفة مرتفعة"); alarmSpoken = true; }
    } else {
      banner.style.display = 'none'; alarmSpoken = false;
    }

    if (d.auto !== isAuto) updateAutoUI(d.auto);
    if (isAuto) {
      setControl('main', d.main);
      setControl('fan', d.fan);
    }
  });

  function setControl(name, val) {
    document.getElementById(name + 'Slider').value = val;
    const pill = document.getElementById(name + 'Pill');
    pill.innerText = val > 0 ? val + '%' : 'مطفأ';
    pill.classList.toggle('on', val > 0);
  }

  function sendCmd(extra = {}) {
    client.publish(TOPIC_CMD, JSON.stringify({
      main:  +document.getElementById('mainSlider').value,
      desk:  +document.getElementById('deskSlider').value,
      night: +document.getElementById('nightSlider').value,
      fan:   +document.getElementById('fanSlider').value,
      auto: isAuto, sp: targetTemp, ...extra
    }));
  }

  function updateAutoUI(state) {
    isAuto = state;
    document.getElementById('autoBtn').classList.toggle('active', isAuto);
    document.getElementById('spBox').style.display = isAuto ? 'block' : 'none';
  }

  function toggleAuto() {
    updateAutoUI(!isAuto);
    sendCmd();
  }

  function updateSetpoint(val) {
    targetTemp = +val;
    document.getElementById('spVal').innerText = val + '°C';
    sendCmd();
  }

  function onSlider(name, breaksAuto) {
    if (breaksAuto && isAuto) updateAutoUI(false);
    setControl(name, +document.getElementById(name + 'Slider').value);
    sendCmd();
  }

  function quickToggle(name) {
    const current = +document.getElementById(name + 'Slider').value;
    const next = current > 0 ? 0 : 100;
    if ((name === 'main' || name === 'fan') && isAuto) updateAutoUI(false);
    setControl(name, next);
    sendCmd();
  }

  function setScene(mode) {
    if (mode === 'study') {
      targetTemp = 23; document.getElementById('spVal').innerText = '23°C';
      setControl('desk', 100); setControl('night', 0);
      updateAutoUI(true); sendCmd({ sp: 23, desk: 100, night: 0, auto: true });
      document.getElementById('aiLog').innerText = "📚 تم تفعيل وضع الدراسة.";
    } else if (mode === 'cinema') {
      updateAutoUI(false);
      setControl('main', 0); setControl('desk', 0); setControl('night', 35); setControl('fan', 40);
      sendCmd({ main: 0, desk: 0, night: 35, fan: 40, auto: false });
      document.getElementById('aiLog').innerText = "🎬 تم تفعيل وضع السينما.";
    } else if (mode === 'sleep') {
      updateAutoUI(false);
      setControl('main', 0); setControl('desk', 0); setControl('night', 15); setControl('fan', 30);
      sendCmd({ main: 0, desk: 0, night: 15, fan: 30, auto: false });
      document.getElementById('aiLog').innerText = "🌙 تصبح على خير! تم تفعيل وضع النوم.";
    } else if (mode === 'off') {
      updateAutoUI(false);
      ['main', 'desk', 'night', 'fan'].forEach(n => setControl(n, 0));
      sendCmd({ main: 0, desk: 0, night: 0, fan: 0, auto: false });
      document.getElementById('aiLog').innerText = "🛑 تم إطفاء جميع أجهزة الغرفة.";
    }
  }

  // المساعد الصوتي والنصي
  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return alert("يرجى استخدام متصفح Chrome للصوت.");
    const rec = new SR();
    rec.lang = 'ar-IQ';
    const btn = document.getElementById('micBtn');
    btn.classList.add('listening'); btn.innerText = "👂 أستمع إليك...";
    rec.onresult = (e) => {
      const text = e.results[0][0].transcript;
      document.getElementById('aiLog').innerText = "أنت: " + text;
      askAI(text);
    };
    rec.onend = () => { btn.classList.remove('listening'); btn.innerText = "🎙️ اضغط للتحدث مع الغرفة"; };
    rec.start();
  }

  function sendTextCmd() {
    const input = document.getElementById('textCmd');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    document.getElementById('aiLog').innerText = "أنت: " + text;
    askAI(text);
  }

  async function askAI(userText) {
    const apiKey = keyInput.value.trim();
    if (!apiKey) {
      document.getElementById('settingsBox').style.display = 'block';
      document.getElementById('aiLog').innerText = "⚠️ أدخل مفتاح Groq API في الأعلى أولاً.";
      return;
    }
    document.getElementById('aiLog').innerText = "⏳ جاري التنفيذ...";

    const prompt = `أنت مساعد غرفة ذكية. الحالة: حرارة ${liveTemp}°C، رطوبة ${liveHum}%، إضاءة ${liveLight}%، السقف(main): ${document.getElementById('mainSlider').value}%، المكتب(desk): ${document.getElementById('deskSlider').value}%، الليلية(night): ${document.getElementById('nightSlider').value}%، المروحة(fan): ${document.getElementById('fanSlider').value}%، التلقائي: ${isAuto}.
    أرجع JSON فقط: {"main":0-100 أو -1,"desk":0-100 أو -1,"night":0-100 أو -1,"fan":0-100 أو -1,"auto":true/false/null,"timer":ثواني أو -1,"reply":"رد عربي قصير"}`;

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: 'openai/gpt-oss-20b',
          messages: [{ role: 'system', content: prompt }, { role: 'user', content: userText }],
          response_format: { type: "json_object" }, temperature: 0.2
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || res.status);

      const cmd = JSON.parse(data.choices[0].message.content);
      if (cmd.auto !== null && cmd.auto !== isAuto) updateAutoUI(cmd.auto);
      if (cmd.desk >= 0)  setControl('desk', cmd.desk);
      if (cmd.night >= 0) setControl('night', cmd.night);
      if (!isAuto) {
        if (cmd.main >= 0) setControl('main', cmd.main);
        if (cmd.fan >= 0)  setControl('fan', cmd.fan);
      }
      sendCmd(cmd.timer > 0 ? { timer: cmd.timer } : {});
      document.getElementById('aiLog').innerText = "🤖 " + cmd.reply;
      speak(cmd.reply);
    } catch (e) {
      document.getElementById('aiLog').innerText = "❌ خطأ: " + e.message;
    }
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA';
      window.speechSynthesis.speak(u);
    }
  }
</script>
</body>
</html>
